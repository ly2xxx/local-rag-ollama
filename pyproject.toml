[project]
name = "local-rag-example"
version = "0.1.0"
description = "Local RAG example using LangChain, Streamlit, and Ollama"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-core>=0.1.0",
    "langchain-ollama>=0.1.0",
    "langchain-chroma>=0.1.0",
    "langchain-huggingface>=0.0.1",
    "langchain-text-splitters>=0.0.1",
    "sentence-transformers>=2.2.2",
    "numpy>=2.0.0",
    "onnxruntime",
    "torchvision",
    "streamlit-chat>=0.1.1",
    "pypdf>=3.17.1",
    "fastembed>=0.1.1",
    "openai>=1.3.6",
    "langchainhub>=0.1.14",
    "chromadb>=0.4.18",
    "streamlit>=1.29.0",
    "watchdog>=3.0.0",
    "smolagents>=1.26.0",
    "litellm>=1.95.0",
]
